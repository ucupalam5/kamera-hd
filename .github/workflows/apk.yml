# Build APK otomatis tiap push (izin langsung diminta saat dibuka via Capacitor)
name: APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install deps
        run: npm install

      - name: Init Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android
          # Tambah izin kamera, mic, lokasi ke AndroidManifest
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q "CAMERA" $MANIFEST || sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />' $MANIFEST
          cat $MANIFEST

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: kamera-hd-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
