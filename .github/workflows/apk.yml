# Build APK otomatis tiap push
name: APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install deps
        run: npm install

      - name: Init Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Hapus permission lama jika ada
          sed -i '/CAMERA/d; /RECORD_AUDIO/d; /ACCESS_FINE_LOCATION/d; /ACCESS_COARSE_LOCATION/d; /WRITE_EXTERNAL_STORAGE/d; /READ_MEDIA/d' $MANIFEST || true
          # Tambah semua izin yang dibutuhkan
          PERMS='    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />'
          sed -i "/<application/i ${PERMS}" $MANIFEST
          # Tambah requestLegacyExternalStorage untuk Android 10
          sed -i 's/<application/<application android:requestLegacyExternalStorage="true"/' $MANIFEST || true
          echo "=== ANDROID MANIFEST ==="
          cat $MANIFEST

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: kamera-hd-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
